<form id="loginForm" class="contact-form">
    <h2 class="form-title">Zaloguj się</h2>

    <div class="form-group">
        <label for="loginUser">Email lub nazwa użytkownika</label>
        <input type="text" id="loginUser" placeholder="np. jan@email.pl">
        <div class="error" id="loginUserError"></div>
    </div>

    <div class="form-group password-wrapper">
        <label for="loginPass">Hasło</label>
        <input type="password" id="loginPass" placeholder="••••••••">
        <span class="toggle-pass" onclick="togglePass('loginPass')">👁</span>
        <div class="error" id="loginPassError"></div>
    </div>

    <div class="form-options">
        <a href="#" class="forgot">Regulamin</a>
        <a href="#" class="forgot">Zapomniałeś hasła?</a>
    </div>

    <button type="submit" class="contact-btn">Zaloguj</button>
</form>
